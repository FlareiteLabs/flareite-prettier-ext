[package]
name = "prettier"
description = "Prettier for Flareite: formats with the project's own Prettier, run by Node.js."
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The editor's repository, checked out beside this one.
flareite-extension-api = { path = "../editor/crates/flareite-extension-api" }
# The JSON lines the extension and its Node.js server talk in.
serde_json = "1.0.145"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
